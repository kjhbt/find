<style>
:root{
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --text:#222222;
  --sub:#767676;
  --faint:#8A8A8A;
  --border:#B7B7B7;
  --border-strong:#8F8F8F;
  --green:#5B8266;
  --green-tint:#EEF4EF;
  --green-text:#3F6249;
  --r-card:16px;
  --r-in:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:break-word;
  overflow:hidden;
}
#scaleOuter{display:flex;justify-content:center;overflow:hidden}
#scaleRoot{transform-origin:top center;padding:48px 20px 60px;box-sizing:border-box}
.wrap{width:520px;max-width:520px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}
.top h1{font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0;color:var(--text)}
#clock{font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.subtitle{font-size:14px;color:var(--sub);margin:0 0 26px}

/* card shells */
.card{
  background:var(--card);border-radius:var(--r-card);
  border:1.5px solid var(--border);
  padding:20px;margin-bottom:14px;
}

/* tabs */
.tbtns{display:flex;gap:8px;margin-bottom:14px}
.tbtn{
  flex:1;height:50px;border-radius:var(--r-in);border:1.5px solid var(--border);
  font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:600;
  cursor:pointer;background:#FAFAFA;color:var(--sub);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,border-color .15s,color .15s;
}
.tbtn svg{width:19px;height:19px;flex-shrink:0}
.tbtn:hover{border-color:var(--border-strong);color:var(--text)}
.tbtn.ag{background:var(--green-tint);color:var(--green-text);border-color:var(--green)}

/* input */
#finderInput{
  width:100%;height:52px;border:1.5px solid var(--border);border-radius:var(--r-in);
  padding:0 16px;font-size:18px;font-family:'Noto Sans KR',sans-serif;font-weight:500;
  background:var(--card);color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
#finderInput::placeholder{color:var(--faint);font-weight:400}
#finderInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
.hint{font-size:13.5px;color:var(--sub);margin:10px 2px 0;line-height:1.6}

/* result card */
#resultCard{display:none}
#resultCard.show{display:block}
.r-name{font-weight:800;font-size:23px;color:var(--text);margin:0 0 12px;line-height:1.3}
.r-status{font-size:18px;line-height:1.6;color:var(--text)}
.r-status .muted{color:var(--sub);font-size:16.5px}
.room-badge{
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;
  background:#fff;color:var(--green-text);border:1.5px solid var(--green);
  border-radius:8px;padding:2px 12px;margin:0 2px;
}
.tag{display:inline-block;font-weight:700;font-size:16.5px;color:var(--green-text)}
.r-empty{font-size:17px;color:var(--sub)}

hr.div{border:none;border-top:1.5px solid var(--border);margin:18px 0 15px}

.tl-label{font-size:12.5px;font-weight:600;color:var(--faint);margin-bottom:9px}
.timeline{display:flex;gap:7px}
.tl-cell{
  flex:1;min-width:0;border-radius:9px;border:1.5px solid var(--border);
  padding:8px 4px 9px;text-align:center;background:#fff;
}
.tl-cell.cur{background:var(--green);border-color:var(--green)}
.tl-num{font-size:11.5px;font-weight:700;color:var(--faint)}
.tl-cell.cur .tl-num{color:rgba(255,255,255,.8)}
.tl-subj{font-size:12.5px;font-weight:600;color:var(--text);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-cell.cur .tl-subj{color:#fff}
.tl-room{font-size:10px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-cell.cur .tl-room{color:rgba(255,255,255,.78)}

/* multi-match list */
.multi-title{font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:8px}
.di{
  padding:12px 4px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;border-radius:8px;transition:background .12s;
}
.di:hover{background:var(--green-tint)}
.di:last-child{border-bottom:none}
.di-name{font-weight:700;color:var(--text);font-size:16px}
.di-cid{font-size:13px;color:var(--faint)}

.foot{text-align:center;font-size:12.5px;color:var(--faint);margin-top:10px}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="scaleOuter"><div id="scaleRoot">
<div class="wrap">

const STUDENTS_DATA = SCHOOL_TT.students;
const TEACHERS_DATA = SCHOOL_TT.teachers;
const PERIOD_TIMES = SCHOOL_TT.periodTimes;
const PERIOD_DURATION_MIN = 50; // 각 교시 수업 시간(분) 가정치

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 학번(예: 30101 = 3학년 1반 1번) → "3-1-01" 형태의 키로 변환
function studentCodeToCid(q){
  if(!/^\d{5}$/.test(q)) return null;
  const grade = q[0];
  const cls = parseInt(q.slice(1,3), 10);
  const num = q.slice(3,5);
  return `${grade}-${cls}-${num}`;
}

// 자동완성 목록은 데이터가 바뀌지 않으므로 페이지 로드 시 딱 한 번만 문자열로 만들어 재사용합니다.
// (탭을 누를 때마다 innerHTML+=으로 한 명씩 이어붙이면 항목이 많을수록 급격히 느려지므로 미리 계산)
const TEACHER_OPTIONS_HTML = Object.keys(TEACHERS_DATA)
  .sort((a,b)=>a.localeCompare(b,'ko'))
  .map(n=>`<option value="${esc(n)}">`).join('');
const STUDENT_OPTIONS_HTML = Object.entries(STUDENTS_DATA)
  .map(([cid,d])=>`<option value="${esc(d[0])}">${esc(cid)}</option>`).join('');

// ── 교사/학생 찾기 (현재 수업 위치) ───────────────
let finderMode='t';
const FINDER_SPECIALS=['공강','자율','진로','스생','스생1','동아리','없음','', null, undefined];
function switchFinderTab(tab){
  finderMode=tab;
  document.getElementById('finderTabT').classList.toggle('ag', tab==='t');
  document.getElementById('finderTabS').classList.toggle('ag', tab==='s');
  const input=document.getElementById('finderInput');
  input.placeholder = tab==='t' ? '교사 이름 검색 (예: 김한슬)' : '학생 이름 또는 학번 검색 (예: 강인규, 30101)';
  input.value='';
  document.getElementById('resultCard').classList.remove('show');
  const dl=document.getElementById('finderDatalist');
  dl.innerHTML = tab==='t' ? TEACHER_OPTIONS_HTML : STUDENT_OPTIONS_HTML;
  input.focus();
}
function getCurrentPeriodInfo(){
  const now=new Date();
  const day=now.getDay();
  const WD=['일','월','화','수','목','금','토'];
  const dayKey=WD[day];
  if(day===0||day===6) return {status:'weekend', dayKey};
  const hm=now.getHours()*60+now.getMinutes();
  const periods=Object.keys(PERIOD_TIMES).map(k=>{
    const [hh,mm]=PERIOD_TIMES[k].split(':').map(Number);
    const start=hh*60+mm;
    return {period:Number(k), start, end:start+PERIOD_DURATION_MIN};
  }).sort((a,b)=>a.period-b.period);
  for(const p of periods){ if(hm>=p.start && hm<p.end) return {status:'in', dayKey, period:p.period}; }
  if(hm<periods[0].start) return {status:'before', dayKey};
  if(hm>=periods[periods.length-1].end) return {status:'after', dayKey};
  return {status:'break', dayKey};
}
function updateFinderClock(){
  const now=new Date();
  const WD=['일','월','화','수','목','금','토'];
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent=`${now.getMonth()+1}.${String(now.getDate()).padStart(2,'0')} (${WD[now.getDay()]}) ${hh}:${mm}`;
}
function onFinderInput(){
  const q=document.getElementById('finderInput').value.trim();
  const rc=document.getElementById('resultCard');
  const box=document.getElementById('finderResult');
  if(!q){ rc.classList.remove('show'); return; }
  rc.classList.add('show');
  const info=getCurrentPeriodInfo();
  if(finderMode==='t'){
    let match=Object.keys(TEACHERS_DATA).find(n=>n===q);
    if(!match) match=Object.keys(TEACHERS_DATA).find(n=>n.includes(q));
    if(!match){ box.innerHTML='<div class="r-empty">일치하는 교사를 찾을 수 없습니다.</div>'; return; }
    renderFinderResult(`${match} 선생님`, TEACHERS_DATA[match], info);
  } else {
    let matches=Object.entries(STUDENTS_DATA).filter(([cid,d])=>cid===q);
    if(!matches.length){
      const codeCid = studentCodeToCid(q);
      if(codeCid && STUDENTS_DATA[codeCid]) matches=[[codeCid, STUDENTS_DATA[codeCid]]];
    }
    if(!matches.length) matches=Object.entries(STUDENTS_DATA).filter(([cid,d])=>d[0]===q);
    if(!matches.length) matches=Object.entries(STUDENTS_DATA).filter(([cid,d])=>d[0].includes(q));
    if(!matches.length){ box.innerHTML='<div class="r-empty">일치하는 학생을 찾을 수 없습니다.</div>'; return; }
    if(matches.length>1){
      box.innerHTML=`<div class="multi-title">동명이인 ${matches.length}명 — 선택하세요</div>`
        + matches.map(([cid,d])=>`<div class="di" onclick="selectStudent('${cid}')"><span class="di-name">${esc(d[0])}</span><span class="di-cid">${esc(cid)}</span></div>`).join('');
      return;
    }
    const [cid,d]=matches[0];
    renderFinderResult(`${cid} ${d[0]}`, d[1], info);
  }
}
function selectStudent(cid){
  const d=STUDENTS_DATA[cid];
  if(!d) return;
  document.getElementById('finderInput').value=d[0];
  renderFinderResult(`${cid} ${d[0]}`, d[1], getCurrentPeriodInfo());
}
function renderFinderResult(label, schedule, info){
  const box=document.getElementById('finderResult');
  let statusHtml='';
  if(info.status==='weekend'){
    statusHtml=`<div class="r-status"><span class="muted">주말입니다. 수업이 없습니다.</span></div>`;
  } else if(info.status==='before'){
    statusHtml=`<div class="r-status"><span class="muted">등교 전입니다. 첫 교시 시작 전이에요.</span></div>`;
  } else if(info.status==='after'){
    statusHtml=`<div class="r-status"><span class="muted">일과가 종료되었습니다.</span></div>`;
  } else if(info.status==='break'){
    statusHtml=`<div class="r-status"><span class="muted">쉬는 시간 / 점심시간입니다.</span></div>`;
  } else {
    const p = schedule && schedule[info.dayKey] && schedule[info.dayKey][info.period-1];
    const subj = p ? p[0] : '', room = p ? p[1] : '';
    if(!p || (!subj && !room)){
      statusHtml=`<div class="r-status"><span class="tag">${info.period}교시</span> <span class="muted">배정된 일정이 없습니다.</span></div>`;
    } else if(FINDER_SPECIALS.includes(subj)){
      statusHtml=`<div class="r-status"><span class="tag">${info.period}교시</span> — <span class="tag">${esc(subj||'-')}</span>${room?` <span class="muted">(${esc(room)})</span>`:''}</div>`;
    } else {
      statusHtml=`<div class="r-status">현재 <span class="room-badge">${esc(room||'위치 미상')}</span> 에서 <span class="muted">${esc(subj)}</span> 수업 중 <span class="muted">· ${info.period}교시</span></div>`;
    }
  }
  let tlHtml='';
  if(info.dayKey && schedule && schedule[info.dayKey]){
    tlHtml = '<div class="timeline">' + schedule[info.dayKey].map((p,i)=>{
      const cur = info.status==='in' && info.period===i+1;
      const subj = p[0]||'-', room = p[1]||'';
      return `<div class="tl-cell${cur?' cur':''}"><div class="tl-num">${i+1}</div><div class="tl-subj">${esc(subj)}</div><div class="tl-room">${esc(room)}</div></div>`;
    }).join('') + '</div>';
  }
  box.innerHTML = `<div class="r-name">${esc(label)}</div>${statusHtml}<hr class="div">
    <div class="tl-label">${info.dayKey||''}요일 시간표</div>${tlHtml || '<span class="muted" style="font-size:14px">주말에는 시간표가 없습니다.</span>'}`;
}

switchFinderTab('t');
updateFinderClock();
setInterval(updateFinderClock, 30000);

// ── 창 크기에 맞춰 전체 내용 배율 자동 조절 ─────────────
// 디자인 기준 폭(520px 콘텐츠 + 좌우 여백)보다 창이 좁아지면 내용 전체를 비례해서 축소합니다.
// (글자만 줄이는 반응형과 달리, 레이아웃 전체가 그대로 작아지는 방식입니다)
const MIN_SCALE = 0.55;
function applyContentScale(){
  const root = document.getElementById('scaleRoot');
  const outer = document.getElementById('scaleOuter');
  if(!root || !outer) return;
  root.style.transform = 'scale(1)';
  const naturalW = root.scrollWidth;
  const naturalH = root.scrollHeight;
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  let scale = Math.min(availW / naturalW, availH / naturalH, 1);
  scale = Math.max(scale, MIN_SCALE);
  root.style.transform = `scale(${scale})`;
  outer.style.width = (naturalW * scale) + 'px';
  outer.style.height = (naturalH * scale) + 'px';
}
window.addEventListener('resize', applyContentScale);
window.addEventListener('load', applyContentScale);
applyContentScale();
// 검색 결과가 표시/숨김되며 내용 높이가 바뀔 때도 다시 계산.
// (transform을 적용하는 #scaleRoot 자신이 아니라 자식인 .wrap을 관찰해 무한 루프를 피합니다)
new MutationObserver(applyContentScale).observe(document.querySelector('.wrap'), {childList:true, subtree:true, attributes:true, attributeFilter:['class']});

// 설치된 PWA(standalone) 창으로 열렸을 때, 내용물 크기에 맞춰 창 크기를 한 번 맞춰봅니다.
// 브라우저 정책상 항상 허용되진 않는 '최선 시도'이며, 실패해도 조용히 무시됩니다.
// (한 번 직접 창 크기를 조절해두면 이후엔 그 크기로 계속 열립니다 — 이게 더 확실한 방법입니다)
if (window.matchMedia('(display-mode: standalone)').matches) {
  try {
    const targetW = 560, targetH = 780;
    if (window.outerWidth > targetW + 100 || window.outerHeight > targetH + 150) {
      window.resizeTo(targetW, targetH);
    }
  } catch (e) {}
}

// 창(화면) 크기를 줄이면 안의 내용 전체(글자·여백·아이콘 등)가 같은 비율로 함께 축소되도록 합니다.
// 특정 지점에서 갑자기 레이아웃이 바뀌는 게 아니라, 실제 화면 배율(zoom)을 창 너비에 맞춰 부드럽게 조절합니다.
const ZOOM_REF_WIDTH = 560; // 이 너비일 때 배율 100%
const ZOOM_MIN = 0.55;      // 아무리 줄어도 최소 이 배율까지만
function applyResponsiveZoom(){
  const scale = Math.min(1, Math.max(ZOOM_MIN, window.innerWidth / ZOOM_REF_WIDTH));
  document.documentElement.style.zoom = scale;
}
window.addEventListener('resize', applyResponsiveZoom);
applyResponsiveZoom();


</script>
