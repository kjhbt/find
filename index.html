*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word; overflow:hidden;
}
#scaleOuter{display:flex;justify-content:center;overflow:hidden}
#scaleRoot{transform-origin:top center;padding:40px 20px 60px;box-sizing:border-box}
.wrap{width:600px;max-width:600px}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
.top h1{font-weight:800;font-size:23px;letter-spacing:-.01em;margin:0;color:var(--text)}
#clock{font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.subtitle{font-size:13.5px;color:var(--sub);margin:0 0 18px}

.toolbtns{display:flex;gap:8px}
.toolbtn{
  height:34px;padding:0 12px;border-radius:20px;border:1.5px solid var(--border);
  background:#FAFAFA;color:var(--sub);font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;
}
.toolbtn:hover{border-color:var(--border-strong);color:var(--text)}
.toolbtn svg{width:15px;height:15px}

.card{background:var(--card);border-radius:var(--r-card);border:1.5px solid var(--border);padding:20px;margin-bottom:14px}

.classgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:4px}
.classbtn{
  height:44px;border-radius:var(--r-in);border:1.5px solid var(--border);background:#FAFAFA;
  color:var(--text);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
}
.classbtn:hover{border-color:var(--border-strong)}
.classbtn.ag{background:var(--green-tint);color:var(--green-text);border-color:var(--green)}

#resultCard{display:none}
#resultCard.show{display:block}
.r-name{font-weight:800;font-size:21px;color:var(--text);margin:0 0 10px}
.r-status{font-size:17px;line-height:1.6;color:var(--text)}
.r-status .muted{color:var(--sub);font-size:15.5px}
.tag{display:inline-block;font-weight:700;font-size:15.5px;color:var(--green-text)}
hr.div{border:none;border-top:1.5px solid var(--border);margin:16px 0 14px}

.tl-label{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.tl-toggle{font-size:12px;color:var(--green-text);cursor:pointer;font-weight:700;background:none;border:none;font-family:inherit;padding:0}

.tt-grid{display:grid;grid-template-columns:34px repeat(5,1fr);gap:6px}
.tt-head{font-size:12px;font-weight:700;color:var(--faint);text-align:center;padding:2px 0 6px}
.tt-head.today{color:var(--green-text);font-weight:800}
.tt-head .today-badge{font-size:9px;font-weight:700;display:block}
.tt-plabel{font-size:11.5px;font-weight:700;color:var(--faint);display:flex;align-items:center;justify-content:center}
.tt-cell{border:1.5px solid var(--border);border-radius:9px;padding:9px 3px;text-align:center;font-size:11.5px;font-weight:600;color:var(--text);background:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-cell.today-col{background:var(--green-tint);border-color:#cfe0d3}
.tt-cell.cur{background:var(--green);border-color:var(--green);color:#fff}

.ref-toggle{
  width:100%;text-align:center;background:none;border:none;color:var(--sub);font-family:inherit;
  font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 0;
}
.reftable{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px}
.reftable th,.reftable td{border:1px solid #999;padding:5px 4px;text-align:center;color:#222}
.reftable th{background:#EFEFEF;font-weight:700}
.reftable caption{font-weight:700;font-size:13.5px;text-align:left;margin-bottom:8px;color:#222}
.ref-section{margin-bottom:26px}
.ref-note{font-size:11.5px;color:#666;margin-top:6px;line-height:1.6}
.ref-scroll{overflow-x:auto}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}

/* modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;
}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:0;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:#F0F0F0;color:var(--sub);font-size:18px;cursor:pointer;z-index:2}
.modal-inner{padding:24px}

/* finder styles (reused inside modal) */
.f-tbtns{display:flex;gap:8px;margin-bottom:14px}
.f-tbtn{flex:1;height:46px;border-radius:var(--r-in);border:1.5px solid var(--border);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;background:#FAFAFA;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.f-tbtn svg{width:18px;height:18px}
.f-tbtn.ag{background:var(--green-tint);color:var(--green-text);border-color:var(--green)}
#finderInput{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--r-in);padding:0 14px;font-size:16.5px;font-family:inherit;font-weight:500;background:#fff;color:var(--text);outline:none;margin-bottom:10px}
#finderInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
.f-hint{font-size:13px;color:var(--sub);margin-bottom:6px}
.room-badge{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#fff;color:var(--green-text);border:1.5px solid var(--green);border-radius:8px;padding:2px 10px;margin:0 2px}
.multi-title{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:8px}
.di{padding:11px 4px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-radius:8px}
.di:hover{background:var(--green-tint)}
.di:last-child{border-bottom:none}
.di-name{font-weight:700;color:var(--text);font-size:15px}
.di-cid{font-size:12.5px;color:var(--faint)}

/* 학생 호출 */
.call-field{margin-bottom:14px}
.call-field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
.call-classgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.call-classbtn{height:38px;border-radius:8px;border:1.5px solid var(--border);background:#FAFAFA;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.call-classbtn.ag{background:var(--green-tint);color:var(--green-text);border-color:var(--green)}
#callStudentInput,#callMessageInput{width:100%;height:44px;border:1.5px solid var(--border);border-radius:var(--r-in);padding:0 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);outline:none}
#callStudentInput:focus,#callMessageInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
.call-msgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.call-msgchip{padding:5px 10px;border-radius:16px;border:1.5px solid var(--border);background:#FAFAFA;color:var(--sub);font-size:12px;font-family:inherit;cursor:pointer}
.call-msgchip:hover{border-color:var(--border-strong);color:var(--text)}
.call-send-btn{width:100%;height:48px;border-radius:var(--r-in);border:none;background:var(--green);color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;margin-top:6px}
.call-send-btn:disabled{background:var(--border);cursor:not-allowed}
.call-status{font-size:13px;text-align:center;margin-top:10px;color:var(--sub)}
.call-status.err{color:#b3413d}
.call-status.ok{color:var(--green-text)}
.board-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-text);
  background:var(--green-tint);border:1.5px solid var(--green);border-radius:20px;padding:4px 10px;cursor:pointer;
}
.gear-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#FAFAFA;color:var(--sub);
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.gear-btn:hover{border-color:var(--border-strong);color:var(--text)}

/* 호출 배너 (전자칠판 표시) */
#callBanners{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-direction:column;gap:0;pointer-events:none}
.call-banner{
  pointer-events:auto;background:#1E3A22;color:#fff;padding:22px 28px;display:flex;align-items:center;
  justify-content:space-between;gap:20px;border-bottom:3px solid #5B8266;animation:callSlideDown .3s ease-out;
}
@keyframes callSlideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.call-banner-text{flex:1;min-width:0}
.call-banner-name{font-size:clamp(22px,4vw,40px);font-weight:800;line-height:1.3}
.call-banner-msg{font-size:clamp(14px,2vw,20px);color:#cfe0d3;margin-top:4px}
.call-banner-confirm{
  flex-shrink:0;height:50px;padding:0 24px;border-radius:10px;border:none;background:#fff;color:#1E3A22;
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
}
.call-banner-confirm:hover{background:#EEF4EF}

@media(max-width:600px){
  .wrap{width:100%}
  .classgrid{grid-template-columns:repeat(4,1fr)}
  .top h1{font-size:19px}
  .card{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="callBanners"></div>
<div id="scaleOuter"><div id="scaleRoot">
<div class="wrap">
  <div class="top">
    <h1>3학년 동시수업 시간표</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="boardBadge" class="board-badge" style="display:none" onclick="openBoardSettings()"></span>
      <span id="clock"></span>
      <button class="gear-btn" onclick="openBoardSettings()" title="전자칠판 설정">⚙</button>
    </div>
  </div>
  <p class="subtitle">반을 선택하면 그 반의 이번 학기 시간표가 계산되어 표시됩니다.</p>

  <div class="card">
    <div class="toolbtns" style="margin-bottom:14px">
      <button class="toolbtn" onclick="openFinder('t')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>
        교사찾기
      </button>
      <button class="toolbtn" onclick="openFinder('s')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 12 5l10 4.5-10 4.5-10-4.5Z"/><path d="M6.5 11.6v4.3c0 1.6 2.5 2.8 5.5 2.8s5.5-1.2 5.5-2.8v-4.3"/><path d="M21 9.5V15"/></svg>
        학생찾기
      </button>
      <button class="toolbtn" onclick="openCallModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4V4Z"/></svg>
        학생호출
      </button>
    </div>
    <div class="classgrid" id="classGrid"></div>
  </div>

  <div class="card" id="resultCard">
    <div id="classResult"></div>
  </div>

  <button class="ref-toggle" onclick="openRefModal()" id="refToggleBtn">▾ 원본 참고표 보기 (그룹 배정 기준)</button>

  <div class="foot">2026학년도 2학기 · 8.31 수정 기준</div>
</div>
</div></div>

<!-- 교사/학생 찾기 모달 -->
<div class="modal-overlay" id="finderModal" onclick="if(event.target===this)closeFinder()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeFinder()">✕</button>
    <div class="modal-inner">
      <div class="f-tbtns">
        <button class="f-tbtn" id="finderTabT" onclick="switchFinderTab('t')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>
          교사
        </button>
        <button class="f-tbtn" id="finderTabS" onclick="switchFinderTab('s')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 12 5l10 4.5-10 4.5-10-4.5Z"/><path d="M6.5 11.6v4.3c0 1.6 2.5 2.8 5.5 2.8s5.5-1.2 5.5-2.8v-4.3"/><path d="M21 9.5V15"/></svg>
          학생
        </button>
      </div>
      <input id="finderInput" list="finderDatalist" placeholder="이름 검색" oninput="onFinderInput()" autocomplete="off">
      <datalist id="finderDatalist"></datalist>
      <div class="f-hint">이름을 입력하면 지금 시각 기준으로 어느 교실에 있는지 바로 알려드려요.</div>
      <hr class="div">
      <div id="finderResult"></div>
    </div>
  </div>
</div>

<!-- 원본 참고표 모달 -->
<div class="modal-overlay" id="refModal" onclick="if(event.target===this)closeRefModal()">
  <div class="modal-box" style="max-width:820px">
    <button class="modal-close" onclick="closeRefModal()">✕</button>
    <div class="modal-inner" id="refModalInner"></div>
  </div>
</div>

<!-- 학생 호출 모달 (선생님용) -->
<div class="modal-overlay" id="callModal" onclick="if(event.target===this)closeCallModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeCallModal()">✕</button>
    <div class="modal-inner">
      <div class="r-name" style="margin-bottom:16px">학생 호출</div>
      <div class="call-field">
        <label>반 선택</label>
        <div class="call-classgrid" id="callClassGrid"></div>
      </div>
      <div class="call-field">
        <label>학생 이름</label>
        <input id="callStudentInput" list="callStudentDatalist" placeholder="반을 먼저 선택하세요" autocomplete="off" disabled>
        <datalist id="callStudentDatalist"></datalist>
      </div>
      <div class="call-field">
        <label>사유 (칠판에 함께 표시됩니다)</label>
        <input id="callMessageInput" placeholder="예: 교무실로 와주세요" autocomplete="off">
        <div class="call-msgchips">
          <button class="call-msgchip" onclick="setCallMessage('교무실로 와주세요')">교무실로</button>
          <button class="call-msgchip" onclick="setCallMessage('상담실로 와주세요')">상담실로</button>
          <button class="call-msgchip" onclick="setCallMessage('보건실로 와주세요')">보건실로</button>
          <button class="call-msgchip" onclick="setCallMessage('행정실로 와주세요')">행정실로</button>
        </div>
      </div>
      <button class="call-send-btn" id="callSendBtn" onclick="submitCall()">호출 보내기</button>
      <div class="call-status" id="callStatus"></div>
    </div>
  </div>
</div>

<!-- 전자칠판 설정 모달 -->
<div class="modal-overlay" id="boardModal" onclick="if(event.target===this)closeBoardSettings()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeBoardSettings()">✕</button>
    <div class="modal-inner">
      <div class="r-name" style="margin-bottom:6px">전자칠판 설정</div>
      <p class="f-hint" style="margin-bottom:16px">이 화면을 특정 반의 전자칠판으로 지정하면, 그 반으로 온 호출이 이 화면에 자동으로 뜹니다.</p>
      <div class="call-field">
        <label>이 화면의 반</label>
        <div class="call-classgrid" id="boardClassGrid"></div>
      </div>
      <div class="call-status" id="boardStatus"></div>
      <button class="call-send-btn" style="background:#B3413D;margin-top:16px" onclick="clearBoardSetting()">전자칠판 설정 해제</button>
    </div>
  </div>

const STUDENTS_DATA = SCHOOL_TT.students;
const TEACHERS_DATA = SCHOOL_TT.teachers;
const PERIOD_TIMES = SCHOOL_TT.periodTimes;
const MASTER = SCHOOL_TT.master;
const PERIOD_DURATION_MIN = 50;
const DAYS = ['월','화','수','목','금'];
const SPECIAL_KEYWORDS = new Set(['자율','공강','창체','스생','진로','일문','동아리']);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── 반별 시간표 계산 (동시수업 마스터 데이터 기반) ──────────
// classSel: 1~11 (반 번호) 또는 '특별실' 문자열
function getClassSchedule(classSel){
  const isSpecialRoom = classSel === '특별실';
  const out = {};
  for(const day of DAYS){
    const row = [];
    for(let period=1; period<=7; period++){
      const cell = MASTER.masterGrid[period][day];
      if(cell && typeof cell === 'object' && cell.special){
        if(isSpecialRoom){
          row.push('-'); // 특별실은 이 예외 교시에 별도 배정이 없음
        } else {
          const fn = MASTER.specialFootnotes[cell.special];
          let subject = '-';
          for(const kw in fn){ if(fn[kw].includes(classSel)){ subject = kw; break; } }
          row.push(subject);
        }
      } else if(SPECIAL_KEYWORDS.has(cell)){
        row.push(isSpecialRoom ? '-' : cell);
      } else if(isSpecialRoom){
        row.push(MASTER.groupSpecialRoom[cell] || '-');
      } else {
        const gs = MASTER.groupSubject[cell] || {};
        row.push(gs[classSel] != null ? gs[classSel] : '-');
      }
    }
    out[day] = row;
  }
  return out;
}

function getCurrentPeriodInfo(){
  const now=new Date();
  const day=now.getDay();
  const WD=['일','월','화','수','목','금','토'];
  const dayKey=WD[day];
  if(day===0||day===6) return {status:'weekend', dayKey};
  const hm=now.getHours()*60+now.getMinutes();
  const periods=Object.keys(PERIOD_TIMES).map(k=>{
    const [hh,mm]=PERIOD_TIMES[k].split(':').map(Number);
    const start=hh*60+mm;
    return {period:Number(k), start, end:start+PERIOD_DURATION_MIN};
  }).sort((a,b)=>a.period-b.period);
  for(const p of periods){ if(hm>=p.start && hm<p.end) return {status:'in', dayKey, period:p.period}; }
  if(hm<periods[0].start) return {status:'before', dayKey};
  if(hm>=periods[periods.length-1].end) return {status:'after', dayKey};
  return {status:'break', dayKey};
}
function updateClock(){
  const now=new Date();
  const WD=['일','월','화','수','목','금','토'];
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${now.getMonth()+1}.${String(now.getDate()).padStart(2,'0')} (${WD[now.getDay()]}) ${hh}:${mm}`;
}

// 공용 시간표 그리드 빌더: 세로축 = 1~7교시, 가로축 = 월~금 (일반적인 시간표 배치)
// getCell(day, periodIndex) -> 표시할 문자열을 반환하는 콜백
function buildTimetableGrid(info, getCell){
  let h = '<div class="tt-grid">';
  h += '<div></div>';
  DAYS.forEach(day=>{
    const isToday = day===info.dayKey;
    h += `<div class="tt-head${isToday?' today':''}">${day}${isToday?'<span class="today-badge">오늘</span>':''}</div>`;
  });
  for(let p=0; p<7; p++){
    h += `<div class="tt-plabel">${p+1}</div>`;
    DAYS.forEach(day=>{
      const isToday = day===info.dayKey;
      const cur = isToday && info.status==='in' && info.period===p+1;
      const val = getCell(day, p);
      h += `<div class="tt-cell${isToday?' today-col':''}${cur?' cur':''}">${esc(val)}</div>`;
    });
  }
  h += '</div>';
  return h;
}

function sendCallToDb(classNum, student, message){
  if(!callDb) return Promise.reject(new Error('NOT_CONFIGURED'));
  return callDb.ref('calls/'+classNum).push({ student, message: message||'', ts: Date.now() });
}
function listenForCalls(classNum, onCall){
  if(!callDb) return;
  callDb.ref('calls/'+classNum).on('child_added', (snap) => onCall(snap.key, snap.val()));
}
function stopListeningForCalls(classNum){
  if(!callDb) return;
  callDb.ref('calls/'+classNum).off('child_added');
}
function confirmCallInDb(classNum, callId){
  if(!callDb) return;
  callDb.ref('calls/'+classNum+'/'+callId).remove();
}

function studentCodeToCid(q){
  if(!/^\d{5}$/.test(q)) return null;
  const grade = q[0], cls = parseInt(q.slice(1,3),10), num = q.slice(3,5);
  return `${grade}-${cls}-${num}`;

function onFinderInput(){
  const q = document.getElementById('finderInput').value.trim();
  const box = document.getElementById('finderResult');
  if(!q){ box.innerHTML=''; return; }
  const info = getCurrentPeriodInfo();
  if(finderMode==='t'){
    let match = Object.keys(TEACHERS_DATA).find(n=>n===q);
    if(!match) match = Object.keys(TEACHERS_DATA).find(n=>n.includes(q));
    if(!match){ box.innerHTML='<div class="muted">일치하는 교사를 찾을 수 없습니다.</div>'; return; }
    renderFinderResult(`${match} 선생님`, TEACHERS_DATA[match], info);
  } else {
    let matches = [];
    const codeCid = studentCodeToCid(q);
    if(codeCid && STUDENTS_DATA[codeCid]) matches = [[codeCid, STUDENTS_DATA[codeCid]]];
    if(!matches.length) matches = Object.entries(STUDENTS_DATA).filter(([cid,d])=>cid===q);
    if(!matches.length) matches = Object.entries(STUDENTS_DATA).filter(([cid,d])=>d[0]===q);
    if(!matches.length) matches = Object.entries(STUDENTS_DATA).filter(([cid,d])=>d[0].includes(q));
    if(!matches.length){ box.innerHTML='<div class="muted">일치하는 학생을 찾을 수 없습니다.</div>'; return; }
    if(matches.length>1){
      box.innerHTML = `<div class="multi-title">동명이인 ${matches.length}명 — 선택하세요</div>`
        + matches.map(([cid,d])=>`<div class="di" onclick="selectStudent('${cid}')"><span class="di-name">${esc(d[0])}</span><span class="di-cid">${esc(cid)}</span></div>`).join('');
      return;
    }
    const [cid,d] = matches[0];
    renderFinderResult(`${cid} ${d[0]}`, d[1], info);
  }
}

// ── 창 크기에 맞춰 배율 자동 조절 ──────────────────
const MIN_SCALE = 0.55;
function applyContentScale(){
  const root = document.getElementById('scaleRoot');
  const outer = document.getElementById('scaleOuter');
  if(!root || !outer) return;
  root.style.transform = 'scale(1)';
  const naturalW = root.scrollWidth, naturalH = root.scrollHeight;
  let scale = Math.min(window.innerWidth/naturalW, window.innerHeight/naturalH, 1);
  scale = Math.max(scale, MIN_SCALE);
  root.style.transform = `scale(${scale})`;
  outer.style.width = (naturalW*scale)+'px';
  outer.style.height = (naturalH*scale)+'px';
}
window.addEventListener('resize', applyContentScale);
window.addEventListener('load', applyContentScale);
new MutationObserver(applyContentScale).observe(document.querySelector('.wrap'), {childList:true, subtree:true, attributes:true, attributeFilter:['class']});

updateClock();
setInterval(updateClock, 30000);
applyContentScale();

// ── 전자칠판 모드 초기화: 이 화면이 특정 반으로 설정되어 있으면
// 그 반 시간표를 자동으로 열고, 호출을 실시간으로 수신 대기합니다.
updateBoardBadge();
const _boardCls = getBoardClass();
if(_boardCls){
  selectClass(Number(_boardCls));
  initBoardListener();
}

// ── 오프라인 캐싱(서비스워커) 등록 ──────────────────
// https(또는 localhost)로 열렸을 때만 시도합니다. 성공하면 이후엔 인터넷이 안 되어도 앱이 열립니다.
// (같은 폴더에 sw.js 파일이 함께 있어야 합니다. 로컬 file://로 열 땐 조용히 건너뜁니다.)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
